<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kavach Setu - Login & Register</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/style.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            DEFAULT: '#3b82f6',
                            hover: '#2563eb'
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="theme-liquid-dark min-h-screen text-main">
    <!-- Centered Fullscreen Container -->
    <div class="min-h-screen w-full flex items-center justify-center p-4">
        <div class="w-full max-w-md glass-panel p-8 space-y-6 relative z-10">
            <div class="text-center">
                <img src="/logo.png" alt="Kavach Setu Logo" class="w-16 h-16 mx-auto mb-3 object-contain rounded-2xl drop-shadow-md">
                <h1 class="text-3xl font-bold tracking-tight text-main">Kavach Setu</h1>
                <p class="text-sm text-muted mt-1 font-medium">Developer API Reverse Proxy & Metrics Portal</p>
            </div>

            <!-- Tabs -->
            <div class="flex rounded-xl modal-sub-card p-1">
                <button id="tab-login" class="flex-1 py-2 text-sm font-bold rounded-lg shadow transition bg-white/10 text-main" onclick="switchTab('login')">Login</button>
                <button id="tab-register" class="flex-1 py-2 text-sm font-medium rounded-lg text-muted hover:text-main transition" onclick="switchTab('register')">Register</button>
            </div>

            <div id="error-msg" class="hidden"></div>

            <!-- Login Form -->
            <form id="login-form" class="space-y-4" onsubmit="handleAuth(event, 'login')">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-main mb-1.5">Email Address</label>
                    <input type="email" id="login-email" required class="w-full px-4 py-2.5 glass-input rounded-xl text-sm font-medium" placeholder="name@example.com">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-main mb-1.5">Password</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-2.5 glass-input rounded-xl text-sm" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full py-3 px-4 bg-primary hover:bg-primary-hover text-white font-bold rounded-xl transition-colors shadow-lg cursor-pointer">Sign In</button>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="space-y-4 hidden" onsubmit="handleAuth(event, 'register')">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-main mb-1.5">Email Address</label>
                    <input type="email" id="register-email" required class="w-full px-4 py-2.5 glass-input rounded-xl text-sm font-medium" placeholder="name@example.com">
                </div>

                <div id="register-step-1-btn">
                    <button type="button" id="btn-send-register-otp" onclick="sendRegisterOtp()" class="w-full py-3 px-4 bg-primary hover:bg-primary-hover text-white font-bold rounded-xl transition-colors shadow-lg flex items-center justify-center cursor-pointer">
                        <span id="btn-send-otp-text">Send Verification Code</span>
                    </button>
                </div>

                <div id="register-step-2" class="space-y-4 hidden border-t pt-4">
                    <div>
                        <div class="flex justify-between items-center mb-1.5">
                            <label class="block text-xs font-bold uppercase tracking-wider text-main">6-Digit Verification Code</label>
                            <button type="button" onclick="sendRegisterOtp()" class="text-xs text-code font-bold hover:underline">Resend Code</button>
                        </div>
                        <input type="text" id="register-otp" maxlength="6" class="w-full px-4 py-2.5 glass-input rounded-xl font-mono text-center tracking-widest text-lg font-bold" placeholder="123456">
                        <p class="text-xs text-muted mt-1 font-medium">Check your inbox. Code expires in 10 minutes.</p>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-main mb-1.5">Password</label>
                        <input type="password" id="register-password" minlength="6" class="w-full px-4 py-2.5 glass-input rounded-xl text-sm" placeholder="••••••••">
                        <p class="text-xs text-muted mt-1 font-medium">Min. 6 chars with letters, numbers & special symbols (!@#$).</p>
                    </div>
                    <button type="submit" id="btn-complete-register" class="w-full py-3 px-4 bg-green-600 hover:bg-green-500 text-white font-bold rounded-xl transition-colors shadow-lg cursor-pointer">Complete Registration</button>
                </div>
            </form>

            <!-- Google Authentication Divider & Button -->
            <div class="space-y-3 pt-2">
                <div class="relative flex items-center justify-center my-2">
                    <div class="border-t border-white/10 w-full"></div>
                    <span class="bg-[#0b0f19] px-3 text-[11px] font-bold uppercase tracking-widest text-muted absolute rounded">OR</span>
                </div>
                <div>
                    <div id="g_id_signin_container" class="flex justify-center w-full min-h-[42px]">
                        <!-- Fallback / Custom styled Google Button -->
                        <button type="button" id="btn-google-fallback" onclick="triggerGoogleSignIn()" class="w-full py-2.5 px-4 rounded-xl border border-white/15 hover:border-white/30 bg-white/5 hover:bg-white/10 transition-all font-bold text-sm text-main flex items-center justify-center space-x-2.5 shadow-sm cursor-pointer">
                            <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24">
                                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                            </svg>
                            <span>Continue with Google</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Floating Theme Switcher Button (Bottom-Right) -->
    <button id="settings-fab" class="fixed bottom-6 right-6 z-50 p-4 rounded-full glass-panel flex items-center justify-center hover:scale-110 transition-transform cursor-pointer shadow-2xl" title="Change Theme">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
    </button>

    <!-- Theme Popover (Bottom-Right) -->
    <div id="settings-popover" class="fixed bottom-24 right-6 w-[320px] z-50 overflow-hidden hidden flex-col glass-panel p-5 shadow-2xl transition-all duration-200 opacity-0 transform scale-95">
        <h3 class="text-sm font-bold uppercase tracking-wider mb-3 text-main">Select Theme</h3>
        <div class="grid grid-cols-2 gap-2.5">
            <button onclick="applyTheme('theme-liquid-dark')" data-theme="theme-liquid-dark" class="p-3 text-xs font-bold rounded-lg border border-slate-700 bg-[#0b0f19] text-white hover:border-cyan-400 transition flex flex-col items-center gap-1.5 shadow-sm">
                <span class="w-3 h-3 rounded-full bg-cyan-400"></span>
                Liquid Dark
            </button>
            <button onclick="applyTheme('theme-liquid-light')" data-theme="theme-liquid-light" class="p-3 text-xs font-bold rounded-lg border border-slate-300 bg-[#ffffff] text-slate-900 hover:border-blue-500 transition flex flex-col items-center gap-1.5 shadow-sm">
                <span class="w-3 h-3 rounded-full bg-blue-600"></span>
                Liquid Light
            </button>
            <button onclick="applyTheme('theme-solarized-dark')" data-theme="theme-solarized-dark" class="p-3 text-xs font-bold rounded-lg border border-slate-700 bg-[#002b36] text-[#93a1a1] hover:border-[#2aa198] transition flex flex-col items-center gap-1.5 shadow-sm">
                <span class="w-3 h-3 rounded-full bg-[#2aa198]"></span>
                Solar Dark
            </button>
            <button onclick="applyTheme('theme-solarized-light')" data-theme="theme-solarized-light" class="p-3 text-xs font-bold rounded-lg border border-slate-300 bg-[#eee8d5] text-[#073642] hover:border-[#268bd2] transition flex flex-col items-center gap-1.5 shadow-sm">
                <span class="w-3 h-3 rounded-full bg-[#268bd2]"></span>
                Solar Light
            </button>
        </div>
    </div>

    <script src="/app.js"></script>
    <script>
        if (localStorage.getItem('token')) {
            window.location.href = '/dashboard.html';
        } else {
            initGoogleAuth();
        }
    </script>
</body>
</html>
