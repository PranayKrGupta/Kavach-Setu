<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - API Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#0f172a',
                            panel: '#1e293b',
                            border: '#334155',
                            text: '#f8fafc',
                            muted: '#94a3b8'
                        },
                        primary: {
                            DEFAULT: '#8b5cf6', // A distinct purple for Admin to differentiate from user dashboard
                            hover: '#7c3aed'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: theme('colors.dark.bg'); color: theme('colors.dark.text'); font-family: 'Inter', sans-serif; }
        /* Custom scrollbar for tables */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: theme('colors.dark.bg'); }
        ::-webkit-scrollbar-thumb { background: theme('colors.dark.border'); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: theme('colors.dark.muted'); }
    </style>
</head>
<body class="min-h-screen pb-12">
    <nav class="border-b border-dark-border bg-dark-panel sticky top-0 z-10 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex-shrink-0 flex items-center space-x-3">
                    <div class="bg-primary p-2 rounded-lg text-white font-bold text-xs tracking-wider">ADMIN</div>
                    <h1 class="text-xl font-bold text-white tracking-tight">System Portal</h1>
                </div>
                <div class="flex items-center space-x-6">
                    <a href="/dashboard.html" class="text-sm text-dark-muted hover:text-white transition-colors">User Dashboard</a>
                    <div class="h-4 w-px bg-dark-border"></div>
                    <span id="admin-email" class="text-sm font-medium text-slate-300"></span>
                    <button onclick="logout()" class="text-sm text-red-400 hover:text-red-300 font-medium transition-colors">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
        
        <!-- Alerts -->
        <div id="alert-box" class="hidden rounded-lg p-4 mb-4 text-sm font-medium shadow-sm transition-all duration-300 transform translate-y-0 opacity-100">
            <span id="alert-msg"></span>
        </div>

        <!-- System Config Section -->
        <section class="bg-dark-panel border border-dark-border rounded-xl p-6 shadow-lg relative overflow-hidden group">
            <div class="absolute top-0 right-0 w-32 h-32 bg-primary/5 rounded-bl-full transition-transform group-hover:scale-110"></div>
            <div class="mb-6 relative z-10">
                <h2 class="text-xl font-bold text-white flex items-center">
                    <svg class="w-5 h-5 mr-2 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    Rate Limit Configuration
                </h2>
                <p class="text-sm text-dark-muted mt-1">Dynamically adjust global API limits across tiers. Takes up to 5 mins to propagate.</p>
            </div>
            
            <div id="configs-container" class="grid grid-cols-1 md:grid-cols-2 gap-6 relative z-10">
                <!-- Configs injected here -->
                <div class="animate-pulse bg-slate-800 h-32 rounded-lg"></div>
                <div class="animate-pulse bg-slate-800 h-32 rounded-lg"></div>
            </div>
        </section>

        <!-- User Management Section -->
        <section class="bg-dark-panel border border-dark-border rounded-xl shadow-lg flex flex-col overflow-hidden">
            <div class="p-6 border-b border-dark-border flex justify-between items-end bg-gradient-to-b from-dark-panel to-slate-900/50">
                <div>
                    <h2 class="text-xl font-bold text-white flex items-center">
                        <svg class="w-5 h-5 mr-2 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                        User Management
                    </h2>
                    <p class="text-sm text-dark-muted mt-1">Manage user access, ban status, and tier subscriptions.</p>
                </div>
                <div class="text-sm text-dark-muted bg-slate-800 px-3 py-1 rounded-md font-mono" id="user-count-badge">
                    Loading...
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-dark-border">
                    <thead class="bg-slate-900/50">
                        <tr>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-dark-muted uppercase tracking-wider">User Details</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-dark-muted uppercase tracking-wider">Role & Keys</th>
                            <th class="px-6 py-4 text-left text-xs font-semibold text-dark-muted uppercase tracking-wider">Tier Assignment</th>
                            <th class="px-6 py-4 text-right text-xs font-semibold text-dark-muted uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-tbody" class="divide-y divide-dark-border bg-dark-panel">
                        <!-- Users injected here -->
                        <tr>
                            <td colspan="4" class="px-6 py-8 text-center text-dark-muted">Loading users...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="/admin.js"></script>
    <script>
        // Simple auth bootstrap
        const userStr = localStorage.getItem('user');
        if (!localStorage.getItem('token') || !userStr) {
            window.location.href = '/';
        } else {
            const user = JSON.parse(userStr);
            if (user.role !== 'ADMIN') {
                window.location.href = '/dashboard.html';
            } else {
                initAdmin();
            }
        }
    </script>
</body>
</html>
